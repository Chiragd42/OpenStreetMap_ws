<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSM Stuttgart Viewer</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; }
    .panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      min-width: 220px;
      font-size: 14px;
    }
    .panel h3 { margin: 0 0 8px 0; font-size: 14px; }
    .panel .row { margin-bottom: 6px; }
    .muted { color: #555; font-size: 12px; }
    .warn { color: #b45309; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h3>OSM Sheet-1 Viewer</h3>
    <div class="row"><strong id="houseCount">Houses: 0</strong></div>
    <div class="row"><strong id="streetCount">Streets: 0</strong></div>
    <div class="row"><strong id="regionCount">Regions: 0</strong></div>
    <div class="row">
      <label><input type="checkbox" id="showHouses" checked /> Houses</label>
      <label><input type="checkbox" id="showStreets" /> Streets</label>
      <label><input type="checkbox" id="showRegions" checked /> Regions</label>
    </div>
    <div class="muted">Backend: <code>http://127.0.0.1:8080</code></div>
    <div class="muted">Move/zoom map to trigger bbox queries.</div>
    <div class="warn" id="tileStatus" style="display:none;">Map tiles are partially blocked on this network/browser. Try disabling strict privacy/ad-block for this page.</div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const backendBase = "http://127.0.0.1:8080";
    const STREET_MIN_ZOOM = 14;
    const STREET_MEDIUM_ZOOM_MAX = 16;
    const REGION_ONLY_MAX_ZOOM = 9;
    const REGION_CONTEXT_MAX_ZOOM = 13;
    const HOUSE_LOW_ZOOM_MAX = 15;
    const HOUSE_MEDIUM_ZOOM_MAX = 17;
    const REFRESH_DEBOUNCE_MS = 180;
    const BBOX_ROUND_DECIMALS = 3;
    const MIN_CENTER_SHIFT_DEG = 0.002;
    const MAX_VIEWPORT_CACHE_ENTRIES = 48;

    const map = L.map("map");
    const germanyBounds = [[47.27, 5.87], [55.06, 15.04]];
    map.fitBounds(germanyBounds);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
      referrerPolicy: "origin"
    })
      .on("tileerror", () => {
        const el = document.getElementById("tileStatus");
        if (el) el.style.display = "block";
      })
      .addTo(map);

    const housesLayer = L.layerGroup().addTo(map);
    const streetsLayer = L.layerGroup().addTo(map);
    const regionsLayer = L.layerGroup().addTo(map);
    const reverseLayer = L.layerGroup().addTo(map);

    const houseCountEl = document.getElementById("houseCount");
    const streetCountEl = document.getElementById("streetCount");
    const regionCountEl = document.getElementById("regionCount");
    const showHousesEl = document.getElementById("showHouses");
    const showStreetsEl = document.getElementById("showStreets");
    const showRegionsEl = document.getElementById("showRegions");
    let refreshTimer = null;
    let activeController = null;
    let lastRenderKey = null;
    let lastBoundsSnapshot = null;
    const viewportCache = new Map();
    let requestSeq = 0;

    async function runReverseGeocode(lat, lon) {
      try {
        const url = `${backendBase}/reverse?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;
        const result = await fetchJson(url);
        const nearest = result.nearest;
        if (!nearest) return;

        reverseLayer.clearLayers();
        const clicked = L.circleMarker([lat, lon], {
          radius: 5,
          color: "#111827",
          fillColor: "#111827",
          fillOpacity: 0.9,
          weight: 1,
        }).addTo(reverseLayer);

        const found = L.circleMarker([nearest.lat, nearest.lon], {
          radius: 6,
          color: "#7c3aed",
          fillColor: "#a78bfa",
          fillOpacity: 0.9,
          weight: 2,
        }).addTo(reverseLayer);

        L.polyline([[lat, lon], [nearest.lat, nearest.lon]], {
          color: "#7c3aed",
          weight: 1.5,
          opacity: 0.9,
          dashArray: "4,4",
        }).addTo(reverseLayer);

        const addr = `${nearest.street || ""} ${nearest.house_number || ""}, ${nearest.postcode || ""} ${nearest.city || ""}, ${nearest.state || ""}, ${nearest.country || ""}`.replace(/\s+,/g, ",").trim();
        const popup = `<strong>Reverse Result</strong><br/>Distance: ${Number(nearest.distance_m || 0).toFixed(1)} m<br/>${addr}`;
        clicked.bindPopup("Clicked location");
        found.bindPopup(popup).openPopup();
      } catch (err) {
        console.error("reverse geocode failed", err);
      }
    }

    function roundCoord(v) {
      return Number(v.toFixed(BBOX_ROUND_DECIMALS));
    }

    function zoomBucket(zoom) {
      if (zoom <= REGION_ONLY_MAX_ZOOM) return "region-only";
      if (zoom <= REGION_CONTEXT_MAX_ZOOM) return "region-context";
      return "detail";
    }

    function maxRegionAdminLevelForZoom(zoom) {
      if (zoom <= 8) return 6;
      if (zoom <= 11) return 8;
      return Number.POSITIVE_INFINITY;
    }

    function captureBoundsSnapshot() {
      const b = map.getBounds();
      return {
        west: b.getWest(),
        south: b.getSouth(),
        east: b.getEast(),
        north: b.getNorth(),
        centerLat: (b.getNorth() + b.getSouth()) * 0.5,
        centerLon: (b.getEast() + b.getWest()) * 0.5,
      };
    }

    function shouldSkipMicroMove(newSnap, newBucket) {
      if (!lastBoundsSnapshot) return false;
      if (lastBoundsSnapshot.bucket !== newBucket) return false;
      const dLat = Math.abs(newSnap.centerLat - lastBoundsSnapshot.centerLat);
      const dLon = Math.abs(newSnap.centerLon - lastBoundsSnapshot.centerLon);
      return dLat < MIN_CENTER_SHIFT_DEG && dLon < MIN_CENTER_SHIFT_DEG;
    }

    function syncLayerVisibility() {
      if (showHousesEl.checked) map.addLayer(housesLayer); else map.removeLayer(housesLayer);
      if (showStreetsEl.checked) map.addLayer(streetsLayer); else map.removeLayer(streetsLayer);
      if (showRegionsEl.checked) map.addLayer(regionsLayer); else map.removeLayer(regionsLayer);
    }

    function bboxParam() {
      const b = map.getBounds();
      return `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`;
    }

    async function fetchJson(url, signal) {
      const res = await fetch(url, { signal });
      if (!res.ok) {
        const body = await res.text();
        throw new Error(`HTTP ${res.status}: ${body}`);
      }
      return res.json();
    }

    function houseQueryForZoom(zoom) {
      if (zoom <= HOUSE_LOW_ZOOM_MAX) {
        return null;
      }
      if (zoom <= HOUSE_MEDIUM_ZOOM_MAX) {
        return "limit=4000&stride=5";
      }
      return "limit=12000&stride=1";
    }

    function streetQueryForZoom(zoom) {
      if (zoom < STREET_MIN_ZOOM) {
        return null;
      }
      if (zoom <= STREET_MEDIUM_ZOOM_MAX) {
        return "limit=50000&stride=1";
      }
      return "limit=120000&stride=1";
    }

    function buildViewportKey(snapshot, zoom, housePlan, streetPlan) {
      return [
        roundCoord(snapshot.west),
        roundCoord(snapshot.south),
        roundCoord(snapshot.east),
        roundCoord(snapshot.north),
        zoomBucket(zoom),
        showHousesEl.checked ? "h1" : "h0",
        showStreetsEl.checked ? "s1" : "s0",
        showRegionsEl.checked ? "r1" : "r0",
        housePlan || "hnone",
        streetPlan || "snone",
      ].join("|");
    }

    function putViewportCache(key, payload) {
      if (viewportCache.has(key)) {
        viewportCache.delete(key);
      }
      viewportCache.set(key, payload);
      while (viewportCache.size > MAX_VIEWPORT_CACHE_ENTRIES) {
        const oldestKey = viewportCache.keys().next().value;
        viewportCache.delete(oldestKey);
      }
    }

    function applyStreetFeatures(streets) {
      streetsLayer.clearLayers();
      for (const s of streets) {
        if (!Array.isArray(s.points) || s.points.length === 0) continue;
        const latLngs = s.points.map(p => [p[0], p[1]]);
        L.polyline(latLngs, { color: "#cc5500", weight: 3, opacity: 0.8 })
          .bindPopup(`${s.name || "(unnamed)"} [${s.highway || "unknown"}]`)
          .addTo(streetsLayer);
      }
    }

    function applyRegionFeatures(regions, zoom) {
      regionsLayer.clearLayers();
      const maxAdminLevel = maxRegionAdminLevelForZoom(zoom);
      const farZoom = zoom <= 8;
      const midZoom = zoom > 8 && zoom <= 11;
      const weight = farZoom ? 1.35 : (midZoom ? 1.7 : 2);
      const fillOpacity = farZoom ? 0.0 : (midZoom ? 0.05 : 0.12);
      const lineOpacity = farZoom ? 0.82 : 0.8;

      for (const r of regions) {
        if (!Array.isArray(r.points) || r.points.length < 3) continue;
        if (r.admin_level != null && r.admin_level > maxAdminLevel) continue;

        const latLngs = r.points.map(p => [p[0], p[1]]);
        L.polygon(latLngs, {
          color: "#2e8b57",
          weight,
          opacity: lineOpacity,
          fillColor: "#58c98a",
          fillOpacity,
        })
          .bindPopup(`${r.name || "(unnamed region)"} (admin_level=${r.admin_level ?? -1})`)
          .addTo(regionsLayer);
      }
    }

    function applyHouseFeatures(houses) {
      housesLayer.clearLayers();
      for (const h of houses) {
        const marker = L.circleMarker([h.lat, h.lon], {
          radius: 3,
          color: "#0055cc",
          fillColor: "#2a7fff",
          fillOpacity: 0.65,
          weight: 1,
        });
        const label = `${h.street || ""} ${h.house_number || ""}, ${h.postcode || ""} ${h.city || ""}`.trim();
        if (label) marker.bindPopup(label);
        marker.addTo(housesLayer);
      }
    }

    function renderPayload(payload, zoom, housePlan, streetPlan) {
      if (!showStreetsEl.checked) {
        streetCountEl.textContent = "Streets: hidden";
      } else if (streetPlan === null) {
        streetCountEl.textContent = `Streets: hidden (zoom >= ${STREET_MIN_ZOOM})`;
        streetsLayer.clearLayers();
      } else {
        applyStreetFeatures(payload.streets);
        streetCountEl.textContent = `Streets: ${payload.streets.length}`;
      }

      if (!showRegionsEl.checked) {
        regionCountEl.textContent = "Regions: hidden";
      } else {
        applyRegionFeatures(payload.regions, zoom);
        regionCountEl.textContent = `Regions: ${payload.regions.length}`;
      }

      if (!showHousesEl.checked) {
        houseCountEl.textContent = "Houses: hidden";
        housesLayer.clearLayers();
      } else if (housePlan === null) {
        houseCountEl.textContent = `Houses: hidden (zoom > ${HOUSE_LOW_ZOOM_MAX})`;
        housesLayer.clearLayers();
      } else {
        applyHouseFeatures(payload.houses);
        houseCountEl.textContent = `Houses: ${payload.houses.length}`;
      }
    }

    function scheduleRefresh() {
      if (refreshTimer !== null) {
        clearTimeout(refreshTimer);
      }
      refreshTimer = setTimeout(() => {
        refreshTimer = null;
        refreshData();
      }, REFRESH_DEBOUNCE_MS);
    }

    async function refreshData() {
      const zoom = map.getZoom();

      if (zoom >= 16 && !showStreetsEl.checked) {
        showStreetsEl.checked = true;
        syncLayerVisibility();
      }

      const snapshot = captureBoundsSnapshot();
      const bucket = zoomBucket(zoom);

      if (shouldSkipMicroMove(snapshot, bucket)) {
        return;
      }

      const bbox = encodeURIComponent(`${snapshot.west},${snapshot.south},${snapshot.east},${snapshot.north}`);
      const housePlan = showHousesEl.checked ? houseQueryForZoom(zoom) : null;
      const streetPlan = showStreetsEl.checked ? streetQueryForZoom(zoom) : null;
      const cacheKey = buildViewportKey(snapshot, zoom, housePlan, streetPlan);

      if (cacheKey === lastRenderKey) {
        return;
      }

      if (viewportCache.has(cacheKey)) {
        renderPayload(viewportCache.get(cacheKey), zoom, housePlan, streetPlan);
        lastRenderKey = cacheKey;
        lastBoundsSnapshot = { ...snapshot, bucket };
        return;
      }

      if (activeController) {
        activeController.abort();
      }
      activeController = new AbortController();
      const signal = activeController.signal;
      const localRequestSeq = ++requestSeq;

      try {
        const requests = [];
        requests.push(showRegionsEl.checked ? fetchJson(`${backendBase}/regions?bbox=${bbox}`, signal) : Promise.resolve({ regions: [] }));
        requests.push(streetPlan ? fetchJson(`${backendBase}/streets?bbox=${bbox}&${streetPlan}`, signal) : Promise.resolve({ streets: [] }));
        requests.push(housePlan ? fetchJson(`${backendBase}/houses?bbox=${bbox}&${housePlan}`, signal) : Promise.resolve({ houses: [] }));

        const [regionsRes, streetsRes, housesRes] = await Promise.all(requests);
        const payload = {
          regions: regionsRes.regions || [],
          streets: streetsRes.streets || [],
          houses: housesRes.houses || [],
        };

        if (localRequestSeq !== requestSeq) {
          return;
        }

        putViewportCache(cacheKey, payload);
        renderPayload(payload, zoom, housePlan, streetPlan);
        lastRenderKey = cacheKey;
        lastBoundsSnapshot = { ...snapshot, bucket };
      } catch (err) {
        if (err?.name === "AbortError") {
          return;
        }
        console.error(err);
      }
    }

    showHousesEl.addEventListener("change", () => {
      syncLayerVisibility();
      scheduleRefresh();
    });
    showStreetsEl.addEventListener("change", () => {
      syncLayerVisibility();
      scheduleRefresh();
    });
    showRegionsEl.addEventListener("change", () => {
      syncLayerVisibility();
      scheduleRefresh();
    });

    map.on("moveend", scheduleRefresh);
    map.on("click", (e) => {
      runReverseGeocode(e.latlng.lat, e.latlng.lng);
    });
    syncLayerVisibility();
    scheduleRefresh();
  </script>
</body>
</html>
