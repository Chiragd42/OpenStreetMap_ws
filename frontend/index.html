<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OpenStreetMap Sheet 1 house viewer">
  <title>OSM Reverse Geocoder</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      min-width: 220px;
      font-size: 14px;
    }
    .panel h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
    }
    .panel .row {
      margin-bottom: 6px;
    }
    .muted {
      color: #555;
      font-size: 12px;
    }
    .warn {
      color: #b45309;
      font-size: 12px;
      margin-top: 6px;
    }
    .btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .layer-toggle {
      display: flex;
      gap: 7px;
      align-items: center;
      cursor: pointer;
      margin-bottom: 6px;
    }
    #houseCount {
      font-weight: 600;
    }
    #zoomValue {
      color: #555;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h3>OSM Reverse Geocoder · Sheet 2</h3>
    <div class="row"><strong id="houseCount">Houses: 0</strong></div>
    <div class="row"><span id="zoomValue">Zoom: —</span></div>
    <div class="row">
      <label class="layer-toggle">
        <input id="showHouses" type="checkbox" checked /> Show houses
      </label>
    </div>
    <div class="row"><label><input id="showStreets" type="checkbox"> Streets</label>
      <label><input id="showRegions" type="checkbox"> Regions</label></div>
    <div class="row"><label><input id="showViewport" type="checkbox" checked> Load objects in view</label></div>
    <div class="row"><label><input id="reverseMode" type="checkbox" checked> Click map to reverse geocode</label></div>
    <div id="reverseResult" class="muted" role="status" style="max-width:300px;max-height:220px;overflow:auto;white-space:pre-line"></div>
    <div class="row">
      <button id="refreshButton" class="btn" type="button">Refresh viewport</button>
    </div>
    <div id="thresholdWarning" class="warn" style="display: none;">
      The display limit was reached. Zoom in for more detail.
    </div>
    <div id="status" class="muted" style="margin-top: 6px;">Loading map…</div>
    <div class="muted">Backend: <code>http://127.0.0.1:8080</code></div>
    <div class="muted">Move or zoom to load visible houses. Red = addressed, gold = no address.</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script id="sheet1-app">
    (() => {
      "use strict";
      const backendBase = "http://127.0.0.1:8080";
      const el = id => document.getElementById(id);
      const map = L.map("map", {preferCanvas: true, minZoom: 3, maxZoom: 19}).setView([48.7758, 9.1829], 16);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "&copy; OpenStreetMap contributors", referrerPolicy: "origin"
      }).on("tileerror", () => { el("status").textContent = "Some map tiles could not load. Check your connection."; }).addTo(map);
      const safeText = text => { const node = document.createElement("div"); node.textContent = text; return node; };
      const houses = L.layerGroup().addTo(map);
      const streets = L.geoJSON(null, {style: {color:"#244b78",weight:3},
        onEachFeature: (feature,layer) => layer.bindPopup(() => safeText(feature.properties.name || feature.properties.id))}).addTo(map);
      const regions = L.geoJSON(null, {style: {color:"#406539",weight:2,fillOpacity:0.04},
        onEachFeature: (feature,layer) => layer.bindPopup(() => safeText(feature.properties.name || feature.properties.id))}).addTo(map);
      const reverse = L.layerGroup().addTo(map);
      const cache = new Map();
      let viewportController = null, reverseController = null, sequence = 0, timer = null;
      const enabled = id => el(id).checked;
      const plans = zoom => ({
        houses: enabled("showHouses") && zoom >= 16,
        streets: enabled("showStreets") && zoom >= 14,
        regions: enabled("showRegions"),
        limit: zoom <= 17 ? 4000 : 10000,
        stride: zoom <= 17 ? 5 : 1
      });
      async function json(url, signal) {
        const response = await fetch(url, {signal});
        const body = await response.json();
        if (!response.ok) throw Error(body.error || `HTTP ${response.status}`);
        return body;
      }
      function render(payload, plan) {
        houses.clearLayers(); streets.clearLayers(); regions.clearLayers();
        for (const h of payload.houses.houses || []) {
          if (!Number.isFinite(h.lat) || !Number.isFinite(h.lon)) continue;
          const color = h.street || h.house_number || h.postcode || h.city ? "#c73a24" : "#c49a42";
          L.circleMarker([h.lat,h.lon], {radius:3,color,fillColor:color,fillOpacity:0.8,weight:1})
            .bindPopup(() => safeText([h.name, [h.street,h.house_number].filter(Boolean).join(" "), [h.postcode,h.city].filter(Boolean).join(" "),h.id].filter(Boolean).join("\n")))
            .addTo(houses);
        }
        streets.addData(payload.streets); regions.addData(payload.regions);
        const count = (payload.houses.houses || []).length;
        el("houseCount").textContent = !enabled("showHouses") ? "Houses: hidden" :
          !plan.houses ? "Houses: zoom in to 16+" : `Houses: ${count.toLocaleString("de-DE")}${plan.stride > 1 ? " (sampled)" : ""}`;
        el("thresholdWarning").style.display = payload.houses.threshold_reached ? "block" : "none";
        const note = enabled("showStreets") && !plan.streets ? " · Streets need zoom 14+" : "";
        el("status").textContent = `Backend online · ${Number(payload.houses.scan_ms || 0).toFixed(1)} ms${note}`;
      }
      async function refresh(force = false) {
        clearTimeout(timer);
        const current = ++sequence;
        if (viewportController) viewportController.abort();
        viewportController = null;
        el("zoomValue").textContent = `Zoom: ${map.getZoom()}`;
        el("refreshButton").disabled = false;
        el("thresholdWarning").style.display = "none";
        if (!enabled("showViewport")) {
          houses.clearLayers(); streets.clearLayers(); regions.clearLayers();
          el("houseCount").textContent = "Houses: viewport off"; el("status").textContent = "Viewport loading is off."; return;
        }
        const zoom = map.getZoom(), plan = plans(zoom), b = map.getBounds();
        const bbox = [Math.max(-180,b.getWest()),Math.max(-90,b.getSouth()),Math.min(180,b.getEast()),Math.min(90,b.getNorth())];
        const key = JSON.stringify([zoom,bbox,plan]);
        if (!force && cache.has(key)) { render(cache.get(key),plan); return; }
        const controller = new AbortController(); viewportController = controller;
        el("refreshButton").disabled = true; el("status").textContent = "Loading visible objects…";
        const query = `bbox=${encodeURIComponent(bbox.join(","))}&zoom=${zoom}`;
        const emptyGeometry = {type:"FeatureCollection",features:[]};
        try {
          const [houseData,streetData,regionData] = await Promise.all([
            plan.houses ? json(`${backendBase}/houses?${query}&limit=${plan.limit}&stride=${plan.stride}`,controller.signal) : {houses:[]},
            plan.streets ? json(`${backendBase}/streets?${query}`,controller.signal) : emptyGeometry,
            plan.regions ? json(`${backendBase}/regions?${query}`,controller.signal) : emptyGeometry
          ]);
          if (current !== sequence) return;
          const payload = {houses:houseData,streets:streetData,regions:regionData};
          cache.set(key,payload); while(cache.size > 8) cache.delete(cache.keys().next().value);
          render(payload,plan);
        } catch(error) {
          if (current !== sequence || error.name === "AbortError") return;
          houses.clearLayers();streets.clearLayers();regions.clearLayers();
          el("houseCount").textContent = "Houses: unavailable";
          el("status").textContent = `Loading failed: ${error.message}`;
        } finally {
          if (current === sequence) { el("refreshButton").disabled = false; viewportController = null; }
        }
      }
      function schedule() {
        // Invalidate and cancel immediately so an old viewport cannot paint during debounce.
        ++sequence; if(viewportController) viewportController.abort();
        clearTimeout(timer); timer = setTimeout(() => refresh(),180);
      }
      map.on("moveend",schedule);
      map.on("zoom",() => {el("zoomValue").textContent = `Zoom: ${map.getZoom()}`;});
      for(const id of ["showHouses","showStreets","showRegions","showViewport"]) {
        el(id).addEventListener("change",() => {
          ++sequence;if(viewportController)viewportController.abort();
          if(!enabled("showHouses"))houses.clearLayers();
          if(!enabled("showStreets"))streets.clearLayers();
          if(!enabled("showRegions"))regions.clearLayers();
          refresh();
        });
      }
      el("refreshButton").addEventListener("click",() => refresh(true));
      el("reverseMode").addEventListener("change",() => {
        if(reverseController)reverseController.abort();reverseController=null;
        reverse.clearLayers();el("reverseResult").textContent="";
      });
      map.on("click",async event => {
        if(!enabled("reverseMode"))return;
        if(reverseController)reverseController.abort();
        const controller = new AbortController();reverseController=controller;
        reverse.clearLayers();el("reverseResult").textContent="Finding closest object…";
        L.circleMarker(event.latlng,{radius:6,color:"#111",fillOpacity:1}).addTo(reverse);
        try {
          const payload=await json(`${backendBase}/reverse?lat=${event.latlng.lat}&lon=${event.latlng.lng}`,controller.signal);
          if(controller!==reverseController || !enabled("reverseMode"))return;
          const hit=payload.nearest;
          el("reverseResult").textContent=hit ? `${hit.kind}: ${hit.name||hit.id}\n${hit.full_address||"Address unavailable in source data"}\n${hit.distance_m.toFixed(1)} m · ${hit.id}\nRegions: ${payload.regions.map(r=>r.name||r.postcode||r.id).join(", ")}` : "No objects found.";
          for(const item of payload.results || []) {
            L.geoJSON(item.geometry,{style:{color:"#b52b20",weight:5,fillOpacity:0.12},
              pointToLayer:(_,latlng)=>L.circleMarker(latlng,{radius:7,color:"#b52b20"})})
              .bindPopup(()=>safeText(`${item.id}: ${item.full_address||item.name}`)).addTo(reverse);
          }
          if(hit)L.polyline([event.latlng,[hit.lat,hit.lon]],{color:"#b52b20",dashArray:"5,5",weight:2}).addTo(reverse);
        } catch(error) {
          if(error.name!=="AbortError" && controller===reverseController)el("reverseResult").textContent=`Reverse lookup failed: ${error.message}`;
        }
      });
      refresh();
    })();
  </script>
</body>
</html>
